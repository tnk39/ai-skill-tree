<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living AI Skill Graph v2</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><p class="eyebrow">LOCAL · EVENT SOURCED · AUDITABLE</p><h1>Living AI Skill Graph <span>v2</span></h1></div><div id="health">SQLite + JSONL</div></header>
<main><section class="canvas-panel"><div class="toolbar"><button data-filter="all" class="active">すべて</button><button data-filter="skill">スキル</button><button data-filter="task">タスク</button><button data-filter="goal">目標</button><button data-filter="agent">エージェント</button><span class="legend"><i class="skill"></i> Skill <i class="task"></i> Task <i class="goal"></i> Goal</span></div><svg id="graph" role="img" aria-label="AI skill graph"></svg><p class="hint">ノードを選択すると詳細を表示します。ドラッグ可能です。</p></section>
<aside><div class="tabs"><button class="active" data-tab="detail">詳細</button><button data-tab="activity">活動</button></div><section id="detail" class="tab active"><p class="muted">ノードを選択してください。</p></section><section id="activity" class="tab"><ol id="activity-list"></ol></section><form id="task-form"><h2>新しいタスク</h2><input id="title" required maxlength="160" placeholder="次に検証する作業"><select id="skill"><option value="">関連スキル（任意）</option></select><button type="submit">タスクを記録</button><output id="form-result"></output></form></aside>
</main><script src="app.js"></script></body></html>
