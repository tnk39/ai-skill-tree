<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Partner Skill Tree</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2733;
      --muted: #64717f;
      --line: #d8dee8;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --accent: #157a6e;
      --accent-2: #c7552b;
      --gold: #bc8b16;
      --blue: #2563a8;
      --red: #b42330;
      --shadow: 0 12px 32px rgba(25, 42, 62, .11);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      overflow-x: hidden;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 10%, rgba(21, 122, 110, .12), transparent 24rem),
        linear-gradient(180deg, #eef4f8 0%, var(--bg) 38%, #f8fafc 100%);
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      min-height: 38px;
      padding: .55rem .8rem;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { border-color: #9eb2c8; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--red); border-color: #e8b4bc; }
    button.ghost { background: transparent; }
    button.small { min-height: 32px; padding: .35rem .55rem; }

    .app-shell {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 16px;
    }

    .title h1 {
      margin: 0 0 6px;
      font-size: clamp(1.65rem, 3.5vw, 3rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      max-width: 780px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .goal-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    select, input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 40px;
      padding: .55rem .65rem;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 82px;
      resize: vertical;
      line-height: 1.55;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }

    .tree-section, .side-panel {
      background: rgba(255, 255, 255, .82);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .section-head h2, .panel-block h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .progress-wrap {
      display: grid;
      grid-template-columns: auto 140px;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
      color: var(--muted);
      font-size: .9rem;
    }

    .progress {
      height: 10px;
      background: #e7ecf2;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      width: 0%;
    }

    .tree-scroll {
      overflow: auto;
      padding: 22px;
      min-height: 560px;
      touch-action: pan-x pan-y;
    }

    .tree-canvas {
      min-width: 900px;
      display: grid;
      gap: 24px;
    }

    .goal-node {
      justify-self: center;
      width: min(620px, 76%);
      text-align: center;
      background: #fff;
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 18px;
      position: relative;
    }

    .goal-node h3 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      letter-spacing: 0;
    }

    .goal-node p { margin: 0; color: var(--muted); line-height: 1.6; }

    .branches {
      display: grid;
      grid-template-columns: repeat(3, minmax(250px, 1fr));
      gap: 18px;
      position: relative;
    }

    .branch {
      display: grid;
      gap: 10px;
      align-content: start;
      border-top: 8px solid var(--blue);
      background: rgba(255, 255, 255, .76);
      border-radius: 8px;
      padding: 12px;
      min-height: 260px;
      position: relative;
    }

    .branch:nth-child(2n) { border-color: var(--accent); }
    .branch:nth-child(3n) { border-color: var(--gold); }
    .branch h3 {
      margin: 0;
      font-size: .98rem;
      letter-spacing: 0;
    }

    .branch::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -30px;
      width: 2px;
      height: 22px;
      background: #aebdcc;
    }

    .skill-card {
      display: grid;
      gap: 8px;
      text-align: left;
      border: 1px solid var(--line);
      border-left-width: 6px;
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      min-height: 116px;
    }

    .skill-card button {
      text-align: left;
      min-height: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
    }

    .skill-card h4 {
      margin: 0;
      font-size: .96rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .skill-card p {
      margin: 0;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.5;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid #d9e0ea;
      border-radius: 999px;
      padding: 0 .55rem;
      font-size: .78rem;
      background: #f8fafc;
      color: #485565;
      white-space: nowrap;
    }

    .state-locked { border-left-color: #8a94a3; }
    .state-trial { border-left-color: #b7791f; }
    .state-proven { border-left-color: #2563a8; }
    .state-stable { border-left-color: #157a6e; }
    .state-improve { border-left-color: #b42330; }

    .side-panel {
      display: grid;
      gap: 0;
    }

    .panel-block {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-block:last-child { border-bottom: 0; }

    .detail-empty {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .kv {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px;
      margin-top: 10px;
      font-size: .92rem;
      line-height: 1.55;
    }

    .kv dt {
      color: var(--muted);
      margin: 0;
    }

    .kv dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .candidate-list, .log-list {
      list-style: none;
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 12px 0 0;
    }

    .candidate-list li, .log-list li {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      line-height: 1.55;
    }

    .log-list time {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      margin-bottom: 3px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-grid label {
      display: grid;
      gap: 6px;
      font-size: .9rem;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(16, 26, 38, .45);
      padding: 18px;
      z-index: 20;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(680px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(10, 18, 28, .26);
    }

    .modal header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal h2 { margin: 0; font-size: 1.05rem; letter-spacing: 0; }
    .modal form { padding: 16px; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .hidden { display: none !important; }

    @media (max-width: 1020px) {
      .workspace { grid-template-columns: 1fr; }
      .tree-scroll { min-height: 470px; }
    }

    @media (max-width: 700px) {
      .app-shell { padding: 12px; }
      header, .goal-bar { grid-template-columns: 1fr; }
      .toolbar { justify-content: stretch; }
      .toolbar button, .goal-bar button { width: 100%; }
      .progress-wrap { grid-template-columns: 1fr; white-space: normal; }
      .tree-canvas { min-width: 720px; }
      .branches { grid-template-columns: repeat(3, minmax(210px, 1fr)); }
      .goal-node { width: 86%; }
      .tree-scroll { padding: 14px; }
      .kv { grid-template-columns: 1fr; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="title">
        <h1>AI Partner Skill Tree</h1>
        <p>ユーザーの到達目標を頂点に置き、AIパートナーが保有・獲得・検証・改善するスキルを可視化します。</p>
      </div>
      <div class="toolbar">
        <button type="button" id="exportJson">JSON書き出し</button>
        <button type="button" id="importJson">JSON読み込み</button>
        <input class="hidden" id="importFile" type="file" accept="application/json,.json">
      </div>
    </header>

    <section class="goal-bar" aria-label="目標操作">
      <select id="goalSelect" aria-label="目標を選択"></select>
      <button type="button" id="addGoal">新規目標</button>
      <button type="button" id="addSkill" class="primary">AIスキル追加</button>
    </section>

    <main class="workspace">
      <section class="tree-section" aria-label="AIスキル樹形図">
        <div class="section-head">
          <h2>目的別AIスキル樹形図</h2>
          <div class="progress-wrap">
            <span id="progressText">目的到達率 0%</span>
            <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
          </div>
        </div>
        <div class="tree-scroll" id="treeScroll">
          <div class="tree-canvas" id="treeCanvas"></div>
        </div>
      </section>

      <aside class="side-panel" aria-label="詳細と攻略ログ">
        <section class="panel-block" id="skillDetail"></section>
        <section class="panel-block">
          <h2>次の解放候補</h2>
          <ul class="candidate-list" id="candidateList"></ul>
        </section>
        <section class="panel-block">
          <h2>攻略ログ</h2>
          <form id="logForm" class="form-grid" style="margin-top:12px">
            <label>ログ
              <textarea id="logText" placeholder="検証結果、判断、次の一手など"></textarea>
            </label>
            <button type="submit">ログ追加</button>
          </form>
          <ul class="log-list" id="logList"></ul>
        </section>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="goalModal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
    <div class="modal">
      <header>
        <h2 id="goalModalTitle">新規目標</h2>
        <button type="button" class="small ghost" data-close="goalModal">閉じる</button>
      </header>
      <form id="goalForm" class="form-grid">
        <label>目標名
          <input id="goalName" required maxlength="80">
        </label>
        <label>説明
          <textarea id="goalDescription" required maxlength="500"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" data-close="goalModal">キャンセル</button>
          <button type="submit" class="primary">追加</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="skillModal" role="dialog" aria-modal="true" aria-labelledby="skillModalTitle">
    <div class="modal">
      <header>
        <h2 id="skillModalTitle">AIスキル</h2>
        <button type="button" class="small ghost" data-close="skillModal">閉じる</button>
      </header>
      <form id="skillForm" class="form-grid">
        <input id="skillId" type="hidden">
        <label>スキル名
          <input id="skillName" required maxlength="80">
        </label>
        <label>能力分野
          <input id="skillCategory" required maxlength="60" list="categoryList">
          <datalist id="categoryList"></datalist>
        </label>
        <label>状態
          <select id="skillState" required></select>
        </label>
        <label>役割
          <textarea id="skillRole" required maxlength="700"></textarea>
        </label>
        <label>依存スキル
          <input id="skillDeps" maxlength="180" placeholder="例：目標分解、検証設計">
        </label>
        <label>解放条件
          <textarea id="skillUnlock" maxlength="700"></textarea>
        </label>
        <label>証拠・実績
          <textarea id="skillEvidence" maxlength="900"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="deleteSkill" class="danger">削除</button>
          <button type="button" data-close="skillModal">キャンセル</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "ai-partner-skill-tree:v1";
      const states = [
        { id: "locked", label: "未解放", score: 0 },
        { id: "trial", label: "試用可能", score: 25 },
        { id: "proven", label: "実証済み", score: 60 },
        { id: "stable", label: "安定運用", score: 100 },
        { id: "improve", label: "改善待ち", score: 45 }
      ];

      const sampleData = {
        activeGoalId: "goal-1",
        goals: [
          {
            id: "goal-1",
            name: "個人の長期目標をAIパートナーと攻略する",
            description: "ユーザーが目的地を決め、AIが必要スキルを獲得・検証・改善しながら成果に近づくための基盤を作る。",
            logs: [
              { id: "log-1", at: "2026-07-20T00:00:00.000Z", text: "初期スキルツリーを作成。ユーザーは目標所有者、AIは実行・検証・改善担当として設計。" }
            ],
            skills: [
              {
                id: "skill-1",
                name: "目標分解",
                category: "戦略設計",
                state: "stable",
                role: "ユーザーの到達目標を、AIが扱える能力分野と個別スキルに分解する。",
                deps: "",
                unlock: "目標と成功条件が文章で説明できる。",
                evidence: "頂点、太い枝、細い枝の構造を定義済み。"
              },
              {
                id: "skill-2",
                name: "優先順位整理",
                category: "戦略設計",
                state: "proven",
                role: "目標達成に近い順にスキル獲得・検証の順番を決める。",
                deps: "目標分解",
                unlock: "目標分解が実証済み以上。",
                evidence: "次の解放候補を自動表示する設計に反映。"
              },
              {
                id: "skill-3",
                name: "証拠管理",
                category: "検証",
                state: "trial",
                role: "成果、判断、失敗、改善案を証拠として残し、状態更新の根拠にする。",
                deps: "目標分解",
                unlock: "スキルごとの証拠・実績欄を運用する。",
                evidence: "スキル詳細と攻略ログに記録欄を実装。"
              },
              {
                id: "skill-4",
                name: "改善ループ",
                category: "検証",
                state: "improve",
                role: "実証済みスキルの不安定さや不足を見つけ、再検証する。",
                deps: "証拠管理",
                unlock: "改善待ちの理由と再検証ログがある。",
                evidence: "改善待ち状態を到達率計算に含める。"
              },
              {
                id: "skill-5",
                name: "JSONバックアップ",
                category: "運用",
                state: "proven",
                role: "localStorageに閉じたデータを、端末間移動や復旧のためにJSONで保存する。",
                deps: "",
                unlock: "書き出し・読み込みの両方が動作する。",
                evidence: "ブラウザ内保存とJSON入出力を実装。"
              },
              {
                id: "skill-6",
                name: "公開後の運用確認",
                category: "運用",
                state: "locked",
                role: "公開URL上で主要機能を検証し、重大なエラーがないことを確認する。",
                deps: "JSONバックアップ, 証拠管理",
                unlock: "GitHub Pages公開後に実URLで操作確認する。",
                evidence: ""
              }
            ]
          },
          {
            id: "goal-2",
            name: "学習計画をAIパートナーが継続改善する",
            description: "ユーザーの学習目的に合わせ、AIが教材選定、進捗検証、復習設計を担う。",
            logs: [],
            skills: [
              {
                id: "skill-7",
                name: "学習課題の棚卸し",
                category: "診断",
                state: "trial",
                role: "ユーザーの現状と目的の差分を整理する。",
                deps: "",
                unlock: "学びたい領域と期限がある。",
                evidence: "初期テンプレートとして登録。"
              }
            ]
          }
        ]
      };

      const els = {
        goalSelect: document.getElementById("goalSelect"),
        addGoal: document.getElementById("addGoal"),
        addSkill: document.getElementById("addSkill"),
        exportJson: document.getElementById("exportJson"),
        importJson: document.getElementById("importJson"),
        importFile: document.getElementById("importFile"),
        treeCanvas: document.getElementById("treeCanvas"),
        progressText: document.getElementById("progressText"),
        progressBar: document.getElementById("progressBar"),
        skillDetail: document.getElementById("skillDetail"),
        candidateList: document.getElementById("candidateList"),
        logForm: document.getElementById("logForm"),
        logText: document.getElementById("logText"),
        logList: document.getElementById("logList"),
        goalModal: document.getElementById("goalModal"),
        goalForm: document.getElementById("goalForm"),
        goalName: document.getElementById("goalName"),
        goalDescription: document.getElementById("goalDescription"),
        skillModal: document.getElementById("skillModal"),
        skillForm: document.getElementById("skillForm"),
        skillModalTitle: document.getElementById("skillModalTitle"),
        skillId: document.getElementById("skillId"),
        skillName: document.getElementById("skillName"),
        skillCategory: document.getElementById("skillCategory"),
        skillState: document.getElementById("skillState"),
        skillRole: document.getElementById("skillRole"),
        skillDeps: document.getElementById("skillDeps"),
        skillUnlock: document.getElementById("skillUnlock"),
        skillEvidence: document.getElementById("skillEvidence"),
        deleteSkill: document.getElementById("deleteSkill"),
        categoryList: document.getElementById("categoryList")
      };

      let data = loadData();
      let selectedSkillId = "";

      function uid(prefix) {
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
      }

      function stateById(id) {
        return states.find((state) => state.id === id) || states[0];
      }

      function loadData() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return structuredClone(sampleData);
          const parsed = JSON.parse(saved);
          validateData(parsed);
          return parsed;
        } catch (error) {
          console.warn("保存データを読み込めなかったため初期データを使用します。", error);
          return structuredClone(sampleData);
        }
      }

      function validateData(value) {
        if (!value || !Array.isArray(value.goals) || value.goals.length === 0) {
          throw new Error("goals array is required");
        }
        value.goals.forEach((goal) => {
          if (!goal.id || !goal.name || !Array.isArray(goal.skills)) {
            throw new Error("invalid goal");
          }
          if (!Array.isArray(goal.logs)) goal.logs = [];
          goal.skills.forEach((skill) => {
            if (!skill.id || !skill.name || !skill.category) throw new Error("invalid skill");
            if (!states.some((state) => state.id === skill.state)) skill.state = "locked";
          });
        });
        if (!value.activeGoalId || !value.goals.some((goal) => goal.id === value.activeGoalId)) {
          value.activeGoalId = value.goals[0].id;
        }
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function activeGoal() {
        return data.goals.find((goal) => goal.id === data.activeGoalId) || data.goals[0];
      }

      function selectedSkill() {
        const goal = activeGoal();
        return goal.skills.find((skill) => skill.id === selectedSkillId) || null;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function render() {
        renderGoalSelect();
        renderTree();
        renderDetail();
        renderCandidates();
        renderLogs();
        renderCategories();
        saveData();
      }

      function renderGoalSelect() {
        els.goalSelect.innerHTML = data.goals.map((goal) =>
          `<option value="${escapeHtml(goal.id)}">${escapeHtml(goal.name)}</option>`
        ).join("");
        els.goalSelect.value = data.activeGoalId;
      }

      function renderTree() {
        const goal = activeGoal();
        const total = goal.skills.length || 1;
        const progress = Math.round(goal.skills.reduce((sum, skill) => sum + stateById(skill.state).score, 0) / total);
        els.progressText.textContent = `目的到達率 ${progress}%`;
        els.progressBar.style.width = `${progress}%`;

        const categories = [...new Set(goal.skills.map((skill) => skill.category || "未分類"))];
        const branches = categories.map((category) => {
          const cards = goal.skills.filter((skill) => skill.category === category).map((skill) => {
            const state = stateById(skill.state);
            const selected = skill.id === selectedSkillId ? " aria-current=\"true\"" : "";
            return `
              <article class="skill-card state-${state.id}">
                <button type="button" data-select-skill="${escapeHtml(skill.id)}"${selected}>
                  <h4>${escapeHtml(skill.name)}</h4>
                </button>
                <div class="badge-row">
                  <span class="badge">${escapeHtml(state.label)}</span>
                  ${skill.deps ? `<span class="badge">依存あり</span>` : ""}
                </div>
                <p>${escapeHtml(skill.role).slice(0, 86)}${skill.role.length > 86 ? "..." : ""}</p>
              </article>`;
          }).join("");

          return `
            <section class="branch">
              <h3>${escapeHtml(category)}</h3>
              ${cards || "<p class=\"detail-empty\">スキルがありません。</p>"}
            </section>`;
        }).join("");

        els.treeCanvas.innerHTML = `
          <section class="goal-node">
            <h3>${escapeHtml(goal.name)}</h3>
            <p>${escapeHtml(goal.description)}</p>
          </section>
          <div class="branches">${branches}</div>`;
      }

      function renderDetail() {
        const skill = selectedSkill();
        if (!skill) {
          els.skillDetail.innerHTML = `
            <h2>スキル詳細</h2>
            <p class="detail-empty" style="margin-top:12px">樹形図のスキルを選択すると、状態、役割、依存関係、解放条件、証拠・実績を確認できます。</p>`;
          return;
        }

        els.skillDetail.innerHTML = `
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
            <h2>${escapeHtml(skill.name)}</h2>
            <button type="button" class="small" data-edit-skill="${escapeHtml(skill.id)}">編集</button>
          </div>
          <dl class="kv">
            <dt>状態</dt><dd>${escapeHtml(stateById(skill.state).label)}</dd>
            <dt>能力分野</dt><dd>${escapeHtml(skill.category)}</dd>
            <dt>役割</dt><dd>${escapeHtml(skill.role)}</dd>
            <dt>依存関係</dt><dd>${escapeHtml(skill.deps || "なし")}</dd>
            <dt>解放条件</dt><dd>${escapeHtml(skill.unlock || "未設定")}</dd>
            <dt>証拠・実績</dt><dd>${escapeHtml(skill.evidence || "未記録")}</dd>
          </dl>`;
      }

      function depsSatisfied(skill, goal) {
        if (!skill.deps) return true;
        const deps = skill.deps.split(",").map((dep) => dep.trim()).filter(Boolean);
        return deps.every((dep) => {
          const match = goal.skills.find((candidate) => candidate.name === dep);
          return match && ["proven", "stable"].includes(match.state);
        });
      }

      function renderCandidates() {
        const goal = activeGoal();
        const candidates = goal.skills
          .filter((skill) => skill.state !== "stable" && depsSatisfied(skill, goal))
          .sort((a, b) => stateById(a.state).score - stateById(b.state).score)
          .slice(0, 5);

        els.candidateList.innerHTML = candidates.length
          ? candidates.map((skill) => `<li><strong>${escapeHtml(skill.name)}</strong><br><span>${escapeHtml(stateById(skill.state).label)} / ${escapeHtml(skill.unlock || "解放条件未設定")}</span></li>`).join("")
          : "<li>現時点で新しい解放候補はありません。</li>";
      }

      function renderLogs() {
        const logs = [...activeGoal().logs].sort((a, b) => new Date(b.at) - new Date(a.at));
        els.logList.innerHTML = logs.length
          ? logs.map((log) => `<li><time datetime="${escapeHtml(log.at)}">${new Date(log.at).toLocaleString("ja-JP")}</time>${escapeHtml(log.text)}</li>`).join("")
          : "<li>まだ攻略ログはありません。</li>";
      }

      function renderCategories() {
        const categories = [...new Set(activeGoal().skills.map((skill) => skill.category).filter(Boolean))];
        els.categoryList.innerHTML = categories.map((category) => `<option value="${escapeHtml(category)}"></option>`).join("");
      }

      function openModal(id) {
        document.getElementById(id).classList.add("open");
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove("open");
      }

      function openSkillForm(skill = null) {
        els.skillModalTitle.textContent = skill ? "AIスキル編集" : "AIスキル追加";
        els.skillId.value = skill ? skill.id : "";
        els.skillName.value = skill ? skill.name : "";
        els.skillCategory.value = skill ? skill.category : "";
        els.skillState.value = skill ? skill.state : "locked";
        els.skillRole.value = skill ? skill.role : "";
        els.skillDeps.value = skill ? skill.deps : "";
        els.skillUnlock.value = skill ? skill.unlock : "";
        els.skillEvidence.value = skill ? skill.evidence : "";
        els.deleteSkill.classList.toggle("hidden", !skill);
        openModal("skillModal");
        els.skillName.focus();
      }

      function exportData() {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "ai-partner-skill-tree.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function importData(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            validateData(parsed);
            data = parsed;
            selectedSkillId = "";
            render();
            alert("JSONを読み込みました。");
          } catch (error) {
            alert("JSONを読み込めませんでした。形式を確認してください。");
            console.error(error);
          }
        };
        reader.readAsText(file);
      }

      states.forEach((state) => {
        const option = document.createElement("option");
        option.value = state.id;
        option.textContent = state.label;
        els.skillState.appendChild(option);
      });

      els.goalSelect.addEventListener("change", () => {
        data.activeGoalId = els.goalSelect.value;
        selectedSkillId = "";
        render();
      });

      els.addGoal.addEventListener("click", () => {
        els.goalForm.reset();
        openModal("goalModal");
        els.goalName.focus();
      });

      els.addSkill.addEventListener("click", () => openSkillForm());
      els.exportJson.addEventListener("click", exportData);
      els.importJson.addEventListener("click", () => els.importFile.click());
      els.importFile.addEventListener("change", () => {
        const file = els.importFile.files[0];
        if (file) importData(file);
        els.importFile.value = "";
      });

      els.goalForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const goal = {
          id: uid("goal"),
          name: els.goalName.value.trim(),
          description: els.goalDescription.value.trim(),
          logs: [],
          skills: []
        };
        data.goals.push(goal);
        data.activeGoalId = goal.id;
        selectedSkillId = "";
        closeModal("goalModal");
        render();
      });

      els.skillForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const goal = activeGoal();
        const payload = {
          id: els.skillId.value || uid("skill"),
          name: els.skillName.value.trim(),
          category: els.skillCategory.value.trim(),
          state: els.skillState.value,
          role: els.skillRole.value.trim(),
          deps: els.skillDeps.value.trim(),
          unlock: els.skillUnlock.value.trim(),
          evidence: els.skillEvidence.value.trim()
        };
        const index = goal.skills.findIndex((skill) => skill.id === payload.id);
        if (index >= 0) goal.skills[index] = payload;
        else goal.skills.push(payload);
        selectedSkillId = payload.id;
        closeModal("skillModal");
        render();
      });

      els.deleteSkill.addEventListener("click", () => {
        const goal = activeGoal();
        const skill = selectedSkill();
        if (!skill) return;
        if (!confirm(`「${skill.name}」を削除しますか？`)) return;
        goal.skills = goal.skills.filter((item) => item.id !== skill.id);
        selectedSkillId = "";
        closeModal("skillModal");
        render();
      });

      els.logForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = els.logText.value.trim();
        if (!text) return;
        activeGoal().logs.push({ id: uid("log"), at: new Date().toISOString(), text });
        els.logText.value = "";
        render();
      });

      document.addEventListener("click", (event) => {
        const skillButton = event.target.closest("[data-select-skill]");
        if (skillButton) {
          selectedSkillId = skillButton.getAttribute("data-select-skill");
          render();
          return;
        }
        const editButton = event.target.closest("[data-edit-skill]");
        if (editButton) {
          const skill = activeGoal().skills.find((item) => item.id === editButton.getAttribute("data-edit-skill"));
          if (skill) openSkillForm(skill);
          return;
        }
        const closeButton = event.target.closest("[data-close]");
        if (closeButton) closeModal(closeButton.getAttribute("data-close"));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeModal("goalModal");
          closeModal("skillModal");
        }
      });

      render();
    })();
  </script>
</body>
</html>
